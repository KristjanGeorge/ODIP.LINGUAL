[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lingualParam"
version = "0.1.0"
description = "LingualParam-CSM™ — Núcleo de cálculo paramétrico para ortodoncia lingual"
requires-python = ">=3.11"
dependencies = [
    "open3d>=0.18.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "openpyxl>=3.1.2",
    "cryptography>=42.0.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "torch>=2.3.0",
]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lingualParam --cov-report=term-missing -v"
